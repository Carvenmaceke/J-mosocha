<style>
:root { --bg: #111112; --fg: #f2efea; --muted: #a39d94; --accent: #cfae7a; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(1000px 520px at 50% 40%, #2a2a2d 0%, #121214 62%, #0b0b0c 100%); color: var(--fg); font: 300 17px/1.7 "Lato", "Helvetica Neue", Arial, sans-serif; text-align: center; }

h1 { font-weight: 300; font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.1; margin: 0; }
p.lede { color: var(--muted); max-width: 460px; margin: 16px auto 30px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
a.btn { display: inline-flex; align-items: center; padding: 14px 26px; border: 1px solid var(--fg); color: var(--fg); text-decoration: none; text-transform: uppercase; letter-spacing: .18em; font-size: .74rem; transition: background .25s, color .25s; }
a.btn:hover { background: var(--fg); color: #111; }
a.btn.wa { background: #25d366; border-color: #25d366; color: #fff; }
a.btn.wa:hover { background: #1eb457; }
small { display: block; margin-top: 40px; color: var(--muted); font-size: .85rem; }
